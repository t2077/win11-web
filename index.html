<script>
/* 开发诊断：?debug=1 时把脚本错误显示在屏幕上，便于截图排查 */
window.__ERRORS__ = [];
(function () {
  var show = /[?&]debug=1/.test(location.search);
  function push(msg) {
    window.__ERRORS__.push(msg);
    if (!show) return;
    var box = document.getElementById('__errbox');
    if (!box) {
      box = document.createElement('div');
      box.id = '__errbox';
      box.style.cssText = 'position:fixed;left:0;top:0;right:0;max-height:45vh;overflow:auto;z-index:99999;' +
        'background:rgba(140,0,0,.94);color:#fff;font:12px/1.5 Consolas,monospace;padding:8px 12px;white-space:pre-wrap';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = window.__ERRORS__.length + ' 个错误:\n' + window.__ERRORS__.join('\n');
  }
  window.addEventListener('error', function (e) {
    push('[' + String(e.filename || '').split('/').pop() + ':' + e.lineno + '] ' + (e.message || e.error));
  });
  window.addEventListener('unhandledrejection', function (e) {
    push('[promise] ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  var ce = console.error;
  console.error = function () { push('[console] ' + Array.prototype.join.call(arguments, ' ')); ce.apply(console, arguments); };
})();
</script>

<!-- ================= 桌面根容器 ================= -->
<div id="os" class="os" aria-hidden="false">

  <!-- 壁纸层 -->
  <div id="wallpaper" class="wallpaper-layer">
    <div class="wallpaper-img" id="wallpaperImg"></div>
    <div class="wallpaper-img wallpaper-img--next" id="wallpaperImgNext"></div>
  </div>

  <!-- 桌面图标层 -->
  <main id="desktop" class="desktop" tabindex="-1">
    <div id="desktopGrid" class="desktop-grid"></div>
    <div id="marquee" class="marquee" hidden></div>
  </main>

  <!-- 窗口层 -->
  <div id="windowLayer" class="window-layer"></div>

  <!-- Snap 贴靠预览遮罩 -->
  <div id="snapPreview" class="snap-preview" hidden><div class="snap-preview__box"></div></div>

  <!-- 全屏覆盖层（任务视图 / Alt+Tab / Snap 助手） -->
  <div id="overlayLayer" class="overlay-layer"></div>

  <!-- 浮出控件层（开始菜单 / 搜索 / 小组件 / 快速设置 / 通知中心） -->
  <div id="flyoutLayer" class="flyout-layer"></div>

  <!-- 任务栏 -->
  <div id="taskbar" class="taskbar" data-align="center">
    <div class="taskbar__bg"></div>
    <div class="taskbar__section taskbar__section--left" id="taskbarLeft"></div>
    <div class="taskbar__section taskbar__section--center" id="taskbarCenter"></div>
    <div class="taskbar__section taskbar__section--right" id="taskbarRight"></div>
  </div>

  <!-- 通知气泡层 -->
  <div id="toastLayer" class="toast-layer"></div>

  <!-- 上下文菜单层 -->
  <div id="menuLayer" class="menu-layer"></div>

  <!-- 拖拽幽灵层 -->
  <div id="dragLayer" class="drag-layer"></div>
</div>

<!-- ================= 启动 / 锁屏 / 登录 ================= -->
<div id="bootScreen" class="boot-screen">
  <div class="boot-inner">
    <div class="boot-logo" id="bootLogo"></div>
    <div class="boot-spinner" id="bootSpinner"><div class="dots"></div></div>
    <div class="boot-text" id="bootText"></div>
  </div>
</div>

<div id="lockScreen" class="lock-screen" hidden>
  <div class="lock-bg" id="lockBg"></div>
  <div class="lock-scrim"></div>
  <div class="lock-content" id="lockContent">
    <div class="lock-clock">
      <div class="lock-time" id="lockTime">--:--</div>
      <div class="lock-date" id="lockDate">--</div>
    </div>
    <div class="lock-status" id="lockStatus"></div>
    <div class="lock-hint">按任意键或点击以解锁</div>
  </div>
  <div class="login-content" id="loginContent" hidden>
    <div class="login-user">
      <div class="login-avatar" id="loginAvatar"></div>
      <div class="login-name" id="loginName">用户</div>
      <form class="login-pin" id="loginForm" autocomplete="off">
        <div class="login-input-wrap">
          <input type="password" id="loginPin" class="login-input" placeholder="PIN" inputmode="numeric" maxlength="6" aria-label="PIN">
          <button type="submit" class="login-submit" id="loginSubmit" title="提交" aria-label="提交"></button>
        </div>
        <div class="login-sub">我忘记了我的 PIN</div>
        <div class="login-options">登录选项</div>
      </form>
      <div class="login-welcome" id="loginWelcome" hidden>欢迎</div>
    </div>
  </div>
  <div class="lock-tray" id="lockTray"></div>
</div>

<div id="shutdownScreen" class="shutdown-screen" hidden>
  <div class="boot-inner">
    <div class="boot-spinner"><div class="dots"></div></div>
    <div class="boot-text" id="shutdownText">正在关机</div>
  </div>
</div>
