<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="52%" r="72%">
      <stop offset="0%"  stop-color="#0d3f74"/>
      <stop offset="34%" stop-color="#082d55"/>
      <stop offset="68%" stop-color="#04182f"/>
      <stop offset="100%" stop-color="#010a16"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="18%"  stop-color="#c8f2ff" stop-opacity=".72"/>
      <stop offset="42%"  stop-color="#41b6f5" stop-opacity=".40"/>
      <stop offset="72%"  stop-color="#1160c4" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0b3f8f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="petalA" x1="0" y1="1" x2="0.25" y2="0">
      <stop offset="0%"   stop-color="#0a3f9c" stop-opacity=".18"/>
      <stop offset="26%"  stop-color="#1a72d8" stop-opacity=".62"/>
      <stop offset="58%"  stop-color="#49b6f2" stop-opacity=".88"/>
      <stop offset="86%"  stop-color="#a7e8ff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#e8fbff" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0%"   stop-color="#062a6e" stop-opacity=".10"/>
      <stop offset="34%"  stop-color="#0f5cbf" stop-opacity=".48"/>
      <stop offset="70%"  stop-color="#2e97e6" stop-opacity=".70"/>
      <stop offset="100%" stop-color="#8fdcff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="petalC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#12e6ff" stop-opacity=".05"/>
      <stop offset="55%"  stop-color="#6fe3ff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#d9f6ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>

    <filter id="softBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <!-- 单片花瓣（原点在花心，向上生长） -->
    <g id="petalShape">
      <path d="M0 0 C -104 -132 -128 -286 -14 -418 C -4 -430 4 -430 14 -418 C 128 -286 104 -132 0 0 Z"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- 远景光晕 -->
  <ellipse cx="960" cy="548" rx="760" ry="620" fill="url(#coreGlow)" opacity=".55" filter="url(#softBig)"/>

  <g transform="translate(960 556) rotate(-8)">
    <!-- 后层花瓣（更暗、更模糊，营造纵深） -->
    <g filter="url(#soft)" opacity=".85" style="mix-blend-mode:screen">
      <g transform="rotate(28) scale(1.06)"><use href="#petalShape" fill="url(#petalB)"/></g>
      <g transform="rotate(96) scale(.98)"><use href="#petalShape" fill="url(#petalB)"/></g>
      <g transform="rotate(163) scale(1.02)"><use href="#petalShape" fill="url(#petalB)"/></g>
      <g transform="rotate(232) scale(.94)"><use href="#petalShape" fill="url(#petalB)"/></g>
      <g transform="rotate(300) scale(1.04)"><use href="#petalShape" fill="url(#petalB)"/></g>
    </g>

    <!-- 中层主花瓣 -->
    <g style="mix-blend-mode:screen">
      <g transform="rotate(-4)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C -104 -132 -128 -286 -14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2.5" opacity=".65"/>
        <path d="M0 0 C 104 -132 128 -286 14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="1.6" opacity=".38"/>
      </g>
      <g transform="rotate(62) scale(.97)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C -104 -132 -128 -286 -14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2.2" opacity=".55"/>
      </g>
      <g transform="rotate(128) scale(1.01)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C -104 -132 -128 -286 -14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity=".45"/>
      </g>
      <g transform="rotate(196) scale(.93)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C 104 -132 128 -286 14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity=".5"/>
      </g>
      <g transform="rotate(262) scale(1)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C 104 -132 128 -286 14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2.3" opacity=".58"/>
      </g>
      <g transform="rotate(322) scale(.95)">
        <use href="#petalShape" fill="url(#petalA)" filter="url(#softS)"/>
        <path d="M0 0 C 104 -132 128 -286 14 -418" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity=".5"/>
      </g>
    </g>

    <!-- 内层小花瓣（高光） -->
    <g style="mix-blend-mode:screen" opacity=".9">
      <g transform="rotate(18) scale(.52)"><use href="#petalShape" fill="url(#petalC)"/></g>
      <g transform="rotate(86) scale(.46)"><use href="#petalShape" fill="url(#petalC)"/></g>
      <g transform="rotate(152) scale(.5)"><use href="#petalShape" fill="url(#petalC)"/></g>
      <g transform="rotate(220) scale(.44)"><use href="#petalShape" fill="url(#petalC)"/></g>
      <g transform="rotate(290) scale(.49)"><use href="#petalShape" fill="url(#petalC)"/></g>
    </g>

    <!-- 花心 -->
    <circle r="120" fill="url(#coreGlow)" style="mix-blend-mode:screen"/>
    <circle r="34" fill="#ffffff" opacity=".55" filter="url(#soft)" style="mix-blend-mode:screen"/>
  </g>

  <!-- 暗角 + 颗粒 -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity=".22" style="mix-blend-mode:multiply"/>
  <radialGradient id="vig" cx="50%" cy="50%" r="76%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".62"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
</svg>
